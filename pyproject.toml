[project]
name = "holon-mysql"
version = "0.1.0"
description = "MySQL statements and transactions over MCP"
requires-python = ">=3.15,<3.16"
dependencies = [
  "cloud-sql-python-connector[pymysql]>=1.18,<2",
  "mcp~=2.3.0",
  "pymysql[rsa]~=1.1.3",
  "sqlalchemy>=2.0,<2.1",
  "types-pymysql>=1.1,<2",
]

[tool.mypy]
strict = true
files = ["server.py"]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.13,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["--numprocesses=auto"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["C901", "E", "F", "I", "PLR0917", "UP"]

[tool.ruff.lint.pylint]
max-positional-args = 3
